<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Entertainment Hub</title>
    <style>
        /* Basic Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #121212;
            color: white;
        }

        header {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid #333;
        }

        nav {
            margin-top: 10px;
        }

        nav a {<nav>
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="movies.html">Movies</a>
</nav>
            color: #00adb5;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            border-left: 5px solid #00adb5;
            padding-left: 10px;
        }

        /* Grid Layout for Games/Movies */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card-image {
            width: 100%;
            height: 150px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h3 {
            margin: 0 0 10px 0;
        }

        .btn {
            display: inline-block;
            background: #00adb5;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<header>
    <h1>Entertainment Hub</h1>
    <nav>
        <a href="#games">Games</a>
        <a href="#movies">Movies</a>
    </nav>
</header>

<div class="container">
    
    <section id="games">
        <h2>My Games</h2>
        <div class="grid">
            <div class="card">
                <div class="card-image">Game Preview</div>
                <div class="card-content">
                    <h3>Game Title</h3>
                    <p>Brief description of your game.</p>
                    <a <a href="game.html" class="btn">Play Now</a>
                </div>
            </div>
            </div>
    </section>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #333;">

    <section id="movies">
        <h2>Movies & Clips</h2>
        <div class="grid">
            <div class="card">
                <div class="card-image">Movie Thumbnail</div>
                <div class="card-content">
                    <h3>Movie Title</h3>
                    <p>A short summary of the video.</p>
                    <a href="https://youtube.com/link-to-video" class="btn">Watch</a>
                </div>
            </div>
            </div>
    </section>

</div>

</body>
</html>
